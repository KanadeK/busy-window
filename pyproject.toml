[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "busy-window"
version = "0.1.0"
description = "Project a local iCalendar export into a finite, merged Busy-only calendar"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md", "third_party_licenses/*"]
authors = [{name = "KanadeK"}]
dependencies = [
  "icalendar==7.3.0", "recurring-ical-events==3.8.2", "tzdata==2026.5",
  "python-dateutil==2.9.0.post0", "x-wr-timezone==2.0.1", "six==1.17.0",
  "click==8.5.0", "typing-extensions==4.15.0; python_version < '3.13'"
]
keywords = ["icalendar", "privacy", "freebusy", "offline", "recurrence"]

[project.scripts]
busy-window = "busy_window.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["busy_window"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85

[project.urls]
Repository = "https://github.com/KanadeK/busy-window"
Issues = "https://github.com/KanadeK/busy-window/issues"
